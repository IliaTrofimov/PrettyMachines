name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PrettyMachines.sln

      - name: Build
        run: dotnet build PrettyMachines.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test PrettyMachines.sln -c Release --no-build --nologo -v q
