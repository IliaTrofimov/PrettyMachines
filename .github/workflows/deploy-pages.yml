name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ "**.cs", "**.html", "**.css", "**.razor", "**.csproj", "**/wwwroot/**" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly app
        run: >-
          dotnet publish PrettyMachines.BlazorUI/PrettyMachines.BlazorUI.csproj
          -c Release
          -o publish
          --nologo

      - name: Configure base path for GitHub Pages
        shell: bash
        run: |
          # Project sites are served from /<repo>/, user sites from the root.
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            base="/"
          else
            base="/$repo/"
          fi

          sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" publish/wwwroot/index.html
          grep -q "<base href=\"$base\" />" publish/wwwroot/index.html

          # GitHub Pages has no SPA rewrite, so unknown paths fall back to 404.html.
          cp publish/wwwroot/index.html publish/wwwroot/404.html

          # Skip Jekyll processing of the _framework folder.
          touch publish/wwwroot/.nojekyll

          echo "App will be served from $base"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
