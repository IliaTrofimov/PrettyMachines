<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pretty Machines</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PrettyMachines.BlazorUI.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</head>

<body id="app">
</body>

<script>
    window.getUrlQueryParam = (key) => {
        const params = new URLSearchParams(window.location.search);
        return params.get(key);
    };

    window.saveDraftToLocalStoage = (algFamilyId, draftId, draftObj) => {
        window.localStorage.setItem(`draft-${algFamilyId}-${draftId}`, JSON.stringify(draftObj, null, 0));
    };

    window.loadDraftsFromLocalStoage = () => {
        const results = [];
        let index = 0;
        let key = null;

        do {
            key = window.localStorage.key(index++);
            if (key?.startsWith("draft-")){
                const parts = key.split('-', 3);
                if (parts.length == 3){
                    const draftObj = JSON.parse(window.localStorage.getItem(key))["draftObj"];
                    results.push({
                        "algFamilyId": parts[1],
                        "draftId": parts[2],
                        "draftObj": JSON.parse(window.localStorage.getItem(key))
                    });
                }
            }
        } 
        while (key != null);

        return results;
    };

    window.saveCultureToLocalStorage = (cultureName) => {
        return window.localStorage.setItem("culture", cultureName ?? "en-US");
    };

    window.loadCultureFromLocalStorage = () => {
        return window.localStorage.getItem("culture") ?? "en-US";
    };
</script>

</html>
